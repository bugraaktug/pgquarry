# pgquarry config
# Pass path to this file: ./pgquarry_worker --config /path/to/pgquarry.toml

[worker]
conninfo         = "host=localhost port=5432 dbname=qdb user=quser password=quser1234"
#model_path       = "/var/lib/pgquarry/models/bge-m3-Q4_K_M.gguf"
model_path       = "/home/rockylinux/models/bge-m3/bge-m3-Q4_K_M.gguf"
dimensions       = 1024
n_threads        = 4
n_ctx            = 512
batch_size       = 16
n_gpu_layers     = 0
poll_interval_ms = 250

# Generation is optional — leave generation_model_path unset and 'generate'
# jobs will just fail with an actionable error instead of blocking startup.
# Needs an instruct/chat-tuned GGUF (with baked-in chat_template metadata),
# not an embedding model like the one above.
generation_model_path    = "/home/rockylinux/models/qwen2.5-0.5b-instruct/qwen2.5-0.5b-instruct-q4_k_m.gguf"
generation_max_tokens    = 128
generation_n_ctx         = 2048
generation_n_threads     = 4
generation_n_gpu_layers  = 0

[retention]
purge_after    = "7d"    # delete status='done' rows older than this; omit/"0" = keep forever
purge_verbose  = false   # when true, log id/status/created_at for every row a sweep deletes

[logging]
log_file    = "/tmp/pgquarry/worker-generate-test.log"
log_level   = "debug"    # trace|debug|info|warn|error|critical|off — debug logs claim/write-back detail per job
max_size_mb = 10         # rotate the active log file once it crosses this size
max_files   = 3          # rotated files kept, oldest deleted beyond this

